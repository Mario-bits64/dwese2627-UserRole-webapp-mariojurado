<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" translate="no">
<head th:replace="~{fragments/head :: head(#{msg.users.title})}"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<main class="list-page">
    <div class="list-card user-list-card">
        <h1 th:text="#{msg.users.title}"></h1>
        <a th:href="@{/users/new}" class="btn btn-success" th:text="#{msg.users.add}"></a>

        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead>
                <tr>
                    <th th:text="#{msg.users.username}"></th>
                    <th th:text="#{msg.users.role}"></th>
                    <th th:text="#{msg.users.status}"></th>
                    <th th:text="#{msg.users.account}"></th>
                    <th th:text="#{msg.users.emailVerified}"></th>
                    <th th:text="#{msg.users.mustChangePassword}"></th>
                    <th th:text="#{msg.users.failedLoginAttempts}"></th>
                    <th th:text="#{msg.users.lastPasswordChange}"></th>
                    <th th:text="#{msg.users.passwordExpiresAt}"></th>
                    <th th:text="#{msg.users.actions}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.username}"></td>
                    <td>
                        <span th:if="${user.role == null || user.role.id == null}" class="text-muted"
                              th:text="#{msg.users.noRole}"></span>
                        <span th:if="${user.role != null && user.role.id != null}"
                              class="badge text-bg-secondary" th:text="${user.role.name}"></span>
                    </td>
                    <td>
                        <span th:if="${user.active}" class="badge text-bg-success" th:text="#{msg.users.active}"></span>
                        <span th:unless="${user.active}" class="badge text-bg-secondary" th:text="#{msg.users.inactive}"></span>
                    </td>
                    <td>
                        <span th:if="${user.accountNonLocked}" class="badge text-bg-success" th:text="#{msg.users.unlocked}"></span>
                        <span th:unless="${user.accountNonLocked}" class="badge text-bg-danger" th:text="#{msg.users.locked}"></span>
                    </td>
                    <td>
                        <span th:if="${user.emailVerified}" class="badge text-bg-success" th:text="#{msg.users.verified}"></span>
                        <span th:unless="${user.emailVerified}" class="badge text-bg-warning" th:text="#{msg.users.unverified}"></span>
                    </td>
                    <td>
                        <span th:if="${user.mustChangePassword}" class="badge text-bg-warning" th:text="#{msg.common.yes}"></span>
                        <span th:unless="${user.mustChangePassword}" class="badge text-bg-secondary" th:text="#{msg.common.no}"></span>
                    </td>
                    <td th:text="${user.failedLoginAttempts}">0</td>
                    <td class="text-nowrap" th:text="${user.lastPasswordChange == null ? '—' : user.lastPasswordChange}"></td>
                    <td class="text-nowrap" th:text="${user.passwordExpiresAt == null ? '—' : user.passwordExpiresAt}"></td>
                    <td class="text-nowrap">
                        <a th:href="@{/users/edit(id=${user.id})}" class="btn btn-primary btn-sm" th:text="#{msg.action.edit}"></a>
                        <form th:action="@{/users/delete}" method="post" class="d-inline">
                            <input type="hidden" name="id" th:value="${user.id}">
                            <button type="submit" class="btn btn-danger btn-sm"
                                    th:onclick="|return confirm('#{msg.users.confirmDelete}');|"
                                    th:text="#{msg.action.delete}"></button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="10" class="text-muted py-4" th:text="#{msg.users.empty}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/}" class="btn btn-secondary" th:text="#{msg.action.backHome}"></a>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
