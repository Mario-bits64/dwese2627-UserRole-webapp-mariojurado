<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}" translate="no">
<head th:replace="~{fragments/head :: head(#{msg.users.formTitle})}"></head>
<body class="d-flex flex-column h-100">
<header th:replace="fragments/header :: header"></header>

<main class="form-page">
    <div class="form-card">
        <h1 th:text="${user.id} == null ? #{msg.users.addTitle} : #{msg.users.editTitle}">Usuario</h1>
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="${user.id == null} ? @{/users/insert} : @{/users/update}"
              th:object="${user}" method="post" class="mt-3">
            <input type="hidden" th:field="*{id}">

            <div class="mb-3">
                <label for="username" class="form-label" th:text="#{msg.users.username}"></label>
                <input type="text" th:field="*{username}" id="username" class="form-control" autocomplete="username">
                <div th:if="${#fields.hasErrors('username')}" class="text-danger" th:errors="*{username}"></div>
            </div>

            <div class="mb-3" th:if="${user.id == null}">
                <label for="failedLoginAttempts" class="form-label" th:text="#{msg.users.failedLoginAttempts}"></label>
                <input type="number" th:field="*{failedLoginAttempts}" id="failedLoginAttempts"
                       class="form-control" min="0" step="1">
                <div th:if="${#fields.hasErrors('failedLoginAttempts')}" class="text-danger"
                     th:errors="*{failedLoginAttempts}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label" th:text="${user.id} == null ? #{msg.users.password} : #{msg.users.newPassword}"></label>
                <input type="password" name="password" id="password" class="form-control"
                       autocomplete="new-password">
                <div class="form-text" th:if="${user.id != null}" th:text="#{msg.users.passwordHint}"></div>
                <div th:if="${passwordError}" class="text-danger" th:text="${passwordError}"></div>
            </div>

            <div class="mb-3" th:if="${user.id == null}">
                <label for="lastPasswordChange" class="form-label" th:text="#{msg.users.lastPasswordChange}"></label>
                <input type="datetime-local" th:field="*{lastPasswordChange}" id="lastPasswordChange"
                       class="form-control" required>
                <div th:if="${#fields.hasErrors('lastPasswordChange')}" class="text-danger"
                     th:errors="*{lastPasswordChange}"></div>
            </div>

            <div class="mb-3">
                <label for="role" class="form-label" th:text="#{msg.users.role}"></label>
                <div th:if="${#lists.isEmpty(availableRoles)}" class="alert alert-warning mb-2">
                    <span th:text="#{msg.users.noAvailableRoles}"></span>
                    <a th:href="@{/roles/new}" th:text="#{msg.users.createRole}"></a>
                </div>
                <select th:field="*{role.id}" id="role" class="form-select">
                    <option value="" th:text="#{msg.users.role.select}"></option>
                    <option th:each="availableRole : ${availableRoles}"
                            th:value="${availableRole.id}"
                            th:text="${availableRole.name}"></option>
                </select>
                <div th:if="${#fields.hasErrors('role.id')}" class="text-danger"
                     th:errors="*{role.id}"></div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{active}" class="form-check-input" id="active">
                <label for="active" class="form-check-label" th:text="#{msg.users.active}"></label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{accountNonLocked}" class="form-check-input" id="accountNonLocked">
                <label for="accountNonLocked" class="form-check-label" th:text="#{msg.users.accountUnlocked}"></label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{emailVerified}" class="form-check-input" id="emailVerified">
                <label for="emailVerified" class="form-check-label" th:text="#{msg.users.emailVerified}"></label>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" th:field="*{mustChangePassword}" class="form-check-input" id="mustChangePassword">
                <label for="mustChangePassword" class="form-check-label" th:text="#{msg.users.mustChangePassword}"></label>
            </div>

            <button type="submit" class="btn btn-primary"
                    th:text="${user.id} == null ? #{msg.action.create} : #{msg.action.save}"></button>
            <a th:href="@{/users}" class="btn btn-secondary" th:text="#{msg.action.backToList}"></a>
        </form>
    </div>
</main>

<footer th:replace="fragments/footer :: footer"></footer>
<div th:replace="fragments/scripts :: scripts"></div>
</body>
</html>
