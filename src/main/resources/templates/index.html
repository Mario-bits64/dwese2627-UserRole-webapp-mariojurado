<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('UserRole')}"></head>

<body class="d-flex flex-column h-100">

<!-- Insertar el fragmento del header -->
<header th:replace="fragments/header :: header"></header>

<!-- Contenido dinámico -->
<main class="home-page">
    <div class="home-card">
        <h1 class="display-5 fw-bold">Gestión de usuarios y roles</h1>
        <p class="lead text-muted">
            Administra usuarios y asigna uno o varios roles a cada cuenta.
        </p>
        <div class="d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
            <a class="btn btn-dark btn-lg" th:href="@{/users}">Gestionar usuarios</a>
            <a class="btn btn-outline-dark btn-lg" th:href="@{/roles}">Gestionar roles</a>
        </div>
    </div>
</main>

<!-- Insertar el fragmento del footer -->
<footer th:replace="fragments/footer :: footer"></footer>

<div th:replace="fragments/scripts :: scripts"></div>

</body>
</html>
